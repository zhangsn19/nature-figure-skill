name: test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: >-
          python scripts/plot_data.py examples/demo.csv
          --kind box --x treatment --y response
          --y-label "Response (a.u.)" --output /tmp/nature-figure-demo
